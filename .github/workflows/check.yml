name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run sprite
      - run: pnpm run build
      # lib/ and src/assets/ are committed because the runtime never builds a
      # plugin: a bundle or sprite that drifted from its generator must fail
      # here (the sprite writer emits stored DEFLATE, so its bytes are stable).
      - run: git diff --exit-code -- lib src/assets
      - run: node --check lib/client.js
      - run: node --check lib/index.js
      - run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
