name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One source of truth: `verify` is typecheck + sprite + check-assets + build + the
      # drift check on lib/ and the hand-drawn icon head (the sprite writer emits stored
      # DEFLATE, so its bytes are stable). The two mascot strips are generated art —
      # scripts/mascot.py needs an Ark API key — so they are checked for geometry.
      # `smoke` runs behaviour checks against a live instance and skips without a URL.
      - run: pnpm run verify
      - run: pnpm run smoke
      - run: node --check lib/client.js
      - run: node --check lib/index.js
      - run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
